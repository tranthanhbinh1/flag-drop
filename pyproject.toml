[project]
name = "flag-drop"
version = "0.1.0"
description = "Flag Drop: 15 years of NYC trips, in data. Polars + Delta Lake -> DuckDB/dbt, orchestrated by Dagster."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestration/flag_drop"]

# Pinned exactly (latest as of 2026-11-23). Bump deliberately, one group at a time.
[dependency-groups]
pipeline = [
    "boto3==1.44.9",
    "dagster==1.13.31",
    "dagster-dbt==0.29.31",
    "dagster-postgres==0.29.31",
    "dagster-webserver==1.13.31",
    "dbt-core==1.12.7",
    "dbt-duckdb==1.11.1",
    "deltalake==1.7.0",
    "duckdb==2.0.1",
    "httpx==0.28.1",
    "polars==2.1.0",
    "python-dotenv==1.2.4",
]
dev = [
    "pre-commit==4.7.0",
    "pyrefly==1.5.0",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.uv]
default-groups = ["dev", "pipeline"]

[tool.dagster]
module_name = "flag_drop.definitions"
code_location_name = "flag_drop"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["flag_drop"]

[tool.pyrefly]
project-includes = ["orchestration", "tests", "scripts"]
python-version = "3.12"
# The editable install puts orchestration/ on sys.path via a .pth file; pyrefly's default heuristics
# would then treat it as site-packages and skip it.
disable-project-excludes-heuristics = true
project-excludes = ["**/.venv/**", "**/__pycache__", "**/node_modules", "data/**"]
